name: GitVerse Projects API Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose-projects-api:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        endpoint:
          - "https://gitverse.ru/api/v1/projects/lifesketch%2Fffmpeg-stream-rec/releases"
          - "https://gitverse.ru/api/v1/projects/lifesketch/ffmpeg-stream-rec/releases"
          - "https://gitverse.ru/api/v1/projects/lifesketch%2Fffmpeg-stream-rec"
          - "https://gitverse.ru/api/v1/projects/lifesketch/ffmpeg-stream-rec"
          - "https://gitverse.ru/api/projects/lifesketch%2Fffmpeg-stream-rec/releases"
          - "https://api.gitverse.ru/api/v1/projects/lifesketch%2Fffmpeg-stream-rec/releases"

    steps:
      - name: Test endpoint
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_RELEASES_TOKEN }}
        run: |
          echo "========================================="
          echo "Testing endpoint:"
          echo "${{ matrix.endpoint }}"
          echo "========================================="

          curl -i \
            -H "PRIVATE-TOKEN: ${GITVERSE_TOKEN}" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            "${{ matrix.endpoint }}" || true

          echo
          echo "========================================="
