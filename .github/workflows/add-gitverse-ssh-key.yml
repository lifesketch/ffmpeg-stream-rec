name: Export GitVerse Token (one-shot)

on:
  workflow_dispatch:

jobs:
  export-token:
    runs-on: ubuntu-latest
    steps:
      - name: Write token artifact
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          set -euo pipefail
          printf 'https://lifesketch:%s@gitverse.ru\n' "${GITVERSE_TOKEN}" > gitverse-credential.txt
          git ls-remote "https://lifesketch:${GITVERSE_TOKEN}@gitverse.ru/seafteam/seaf-bok.git" HEAD
      - name: Upload credential artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitverse-credential
          path: gitverse-credential.txt
          retention-days: 1
