name: Add GitVerse SSH Key (one-shot)

on:
  workflow_dispatch:

jobs:
  add-key:
    runs-on: ubuntu-latest
    steps:
      - name: Add SSH key to GitVerse account
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          set -euo pipefail
          KEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINjS9FJjXuA4T3Ok35KRGYL1cIr767YqDOaESjRbiiZ6 calypso2004@gmail.com'

          probe() {
            local name="$1"
            shift
            echo "===== ${name} ====="
            curl -sS -i "$@" | sed -n '1,30p'
            echo
          }

          probe "POST deploy key seafteam/seaf-bok Bearer" \
            -X POST \
            -H "Authorization: Bearer ${GITVERSE_TOKEN}" \
            -H 'Accept: application/vnd.gitverse.object+json;version=1' \
            -H 'Content-Type: application/json' \
            -d "{\"title\":\"macbook-victor-seaf-bok\",\"key\":\"${KEY}\",\"read_only\":true}" \
            'https://api.gitverse.ru/repos/seafteam/seaf-bok/keys'

          probe "POST deploy key lifesketch/ffmpeg-stream-rec Bearer" \
            -X POST \
            -H "Authorization: Bearer ${GITVERSE_TOKEN}" \
            -H 'Accept: application/vnd.gitverse.object+json;version=1' \
            -H 'Content-Type: application/json' \
            -d "{\"title\":\"macbook-victor-ffmpeg\",\"key\":\"${KEY}\",\"read_only\":true}" \
            'https://api.gitverse.ru/repos/lifesketch/ffmpeg-stream-rec/keys'
