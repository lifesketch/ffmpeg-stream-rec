name: Sync to GitVerse

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches and tags
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git fetch origin '+refs/tags/*:refs/tags/*' --force

      - name: Configure GitVerse remote
        run: |
          git remote add gitverse https://lifesketch:${{ secrets.GITVERSE_TOKEN }}@gitverse.ru/lifesketch/ffmpeg-stream-rec.git

      - name: Mirror all branches and tags to GitVerse
        run: |
          git push gitverse '+refs/remotes/origin/*:refs/heads/*' --prune
          git push gitverse '+refs/tags/*:refs/tags/*' --force
