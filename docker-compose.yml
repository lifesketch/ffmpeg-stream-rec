# Локальная разработка: python -m recorder из venv (без Docker).
#
# Перед первым up на части хостов (Synology и др.): mkdir -p docker-data
# Docker: данные на хосте в ./docker-data/ (удобно копировать проект вместе с записями):
#   docker-data/recordings/  — MP4
#   docker-data/state.sqlite3
#   docker-data/logs/
#
# Пути внутри контейнера фиксированы; переменные RECORDINGS_ROOT / STATE_DB_PATH / LOG_DIR
# из .env для этого сервиса не используются (их переопределяет блок environment ниже).

services:
  recorder:
    build: .
    # tini как PID 1: корректные SIGTERM и «сбор» зомби от FFmpeg (без этого на slim бывают сюрпризы).
    init: true
    ports:
      - "${HOST_PORT:-8080}:5000"
    environment:
      FLASK_RUN_HOST: "0.0.0.0"
      FLASK_RUN_PORT: "5000"
      RECORDINGS_ROOT: /data/recordings
      STATE_DB_PATH: /data/state.sqlite3
      LOG_DIR: /data/logs
    env_file:
      - .env
    volumes:
      - ./docker-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
